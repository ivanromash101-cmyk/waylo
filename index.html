<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waylo — маршруты и билеты</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d3bd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, practical travel desk — clear like station signage.
   IDEA: a transit-line map plus ticket stubs: every trip reads as a coloured line with stations.
   PICTURE: the live search panel on a cobalt band; each result a ticket; details a vertical route line + mini map.
   COLOUR and TYPE: cobalt #1d3bd1 band, white paper, signal orange #ff5a2c accent; mode colours on the line. Overpass (highway lettering).
   LAYOUT: search band full width, results row of three tickets, detail below in two columns that stack under 760px. */
:root{color-scheme:light dark;
--bg:light-dark(#f6f7fb,#0d1124);--card:light-dark(#fff,#161b36);--ink:light-dark(#121633,#eef0ff);--mute:light-dark(#5a6085,#a3a9cc);
--line:light-dark(#dfe2ef,#2a3058);--band:#1d3bd1;--band2:#1530a8;--acc:#ff5a2c;
--air:#7b5cff;--train:#0fa37f;--bus:#ff8a00;--car:#e0397a;--local:#8a90b0;--stay:#2b8be6}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Overpass,system-ui,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
a{color:inherit}
.band{padding:clamp(22px,4vw,48px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
header.band{background:var(--band);color:#fff;padding-bottom:clamp(28px,4vw,56px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.logo{font-weight:800;font-size:22px;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.logo i{width:26px;height:26px;border-radius:50%;border:5px solid var(--acc);display:inline-block}
h1{font-size:clamp(30px,4.6vw,48px);line-height:1.05;margin:0 0 6px;font-weight:800;text-wrap:balance}
.sub{margin:0 0 22px;opacity:.85;max-width:62ch}
select,input,button{font:inherit;font-size:16px}
.lang{background:var(--band2);color:#fff;border:1px solid #ffffff40;border-radius:10px;padding:8px 10px;min-height:44px}
form.s{background:var(--card);color:var(--ink);border-radius:18px;padding:18px;display:grid;gap:14px;box-shadow:0 18px 40px #0b166040}
.row{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr)}
.row2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mute);font-weight:600}
.inp{display:flex;gap:6px}
.inp input{flex:1}
input,select.c{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:transparent;color:var(--ink)}
select.c option{color:#121633}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.ib{min-width:48px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.swap{align-self:end}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);cursor:pointer;font-weight:600}
.chip input:checked+span{background:var(--band);border-color:var(--band);color:#fff}
.chip input:focus-visible+span{outline:3px solid var(--acc)}
.go{min-height:54px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;font-size:18px;cursor:pointer}
.msg{font-size:14px;color:var(--mute);min-height:1.2em}
.msg.err{color:var(--acc)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
h2{font-size:26px;line-height:1.1;margin:0 0 14px}
.tickets{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.tk{background:var(--card);border:1.5px solid var(--line);border-radius:18px;display:grid;grid-template-rows:auto 1fr;overflow:hidden;cursor:pointer;text-align:left;color:var(--ink);padding:0}
.tk.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tk .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800;border-bottom:2px dashed var(--line)}
.badge{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--bg)}
.tk .bd{padding:14px 16px;display:grid;gap:10px}
.times{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.times b{font-size:30px;line-height:1}
.times small{display:block;color:var(--mute);font-size:13px}
.strip{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.kv span:first-child{color:var(--mute)}
.price{font-size:22px;font-weight:800;white-space:nowrap}
.det{display:grid;gap:18px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px}
.cd{background:var(--band);color:#fff;border-radius:18px;padding:18px;display:grid;gap:4px}
.cd b{font-size:clamp(28px,4vw,40px);line-height:1.05;white-space:nowrap}
ol.route{list-style:none;margin:0;padding:0}
ol.route li{position:relative;padding:0 0 18px 34px}
ol.route li::before{content:"";position:absolute;left:9px;top:22px;bottom:-2px;width:5px;border-radius:3px;background:var(--c,var(--line))}
ol.route li:last-child::before{display:none}
ol.route li::after{content:"";position:absolute;left:3px;top:4px;width:17px;height:17px;border-radius:50%;background:var(--card);border:4px solid var(--c,var(--line))}
.lt{font-weight:800}
.lp{color:var(--mute);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--train);border-color:var(--train);color:#fff}
.vz{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.vz li{padding:10px 12px;border-radius:12px;border-left:5px solid var(--train);background:var(--bg);font-size:15px}
.vz li.warn{border-color:var(--bus)}.vz li.need{border-color:var(--acc)}
.fig{position:relative;min-height:260px;border-radius:14px;background:var(--bg);overflow:hidden}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.note{font-size:13px;color:var(--mute)}
.trips{display:grid;gap:10px}
.trip{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.hidden{display:none!important}
.lv{background:var(--train);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mute);margin-top:8px}
.legend span{display:inline-flex;gap:6px;align-items:center}
@media(max-width:760px){.det{grid-template-columns:1fr}}
@media(max-width:520px){.row{grid-template-columns:1fr}.swap{justify-self:end;margin-top:-6px}.times b{font-size:24px}}
@media(prefers-reduced-motion:no-preference){.tk{transition:transform .15s}.tk:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <div class="top"><div class="logo"><i></i>Waylo</div>
    <span style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="lang hidden" id="inst"></button><select id="lang" class="lang" aria-label="Language"></select></span></div>
  <h1 data-t="h1">Куда едем?</h1>
  <p class="sub" data-t="tag"></p>
  <form class="s" id="f" autocomplete="off">
    <div class="row">
      <label class="f"><span data-t="from"></span>
        <span class="inp"><input id="from" list="cities" required><button type="button" class="ib" id="geo" title="📍">📍</button></span></label>
      <button type="button" class="ib swap" id="swap" aria-label="swap">⇄</button>
      <label class="f"><span data-t="to"></span>
        <span class="inp"><input id="to" list="cities" required><button type="button" class="ib hidden" id="mic" aria-label="mic">🎤</button></span></label>
    </div>
    <div class="row2">
      <label class="f"><span data-t="whenMode"></span><select id="wmode" class="c"><option value="dep" data-t="depart"></option><option value="arr" data-t="arrive"></option></select></label>
      <label class="f"><span data-t="when"></span><input id="when" type="datetime-local" required></label>
      <label class="f"><span data-t="travelers"></span><input id="n" type="number" min="1" max="9" value="1"></label>
      <label class="f"><span data-t="passport"></span><select id="pass" class="c"></select></label>
    </div>
    <div class="f"><span class="note" data-t="modes"></span>
      <div class="chips" id="modes"></div></div>
    <div class="row2">
      <label class="f"><span data-t="rest"></span><select id="rest" class="c"><option value="none" data-t="restNone"></option><option value="breaks" data-t="restBreaks"></option><option value="night" data-t="restNight"></option></select></label>
      <label class="f"><span data-t="maxTr"></span><select id="maxtr" class="c"><option value="9" data-t="any"></option><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></label>
    </div>
    <label class="chip" style="justify-self:start"><input type="checkbox" id="live" checked><span>📡 <span data-t="liveOn"></span></span></label>
    <button class="go" data-t="search"></button>
    <div class="msg" id="msg" role="status"></div>
  </form>
  <datalist id="cities"></datalist>
</div></header>

<main>
<section class="band hidden" id="res"><div class="wrap">
  <h2 data-t="options"></h2>
  <div class="tickets" id="tickets"></div>
  <p class="note" data-t="estimate"></p><p class="note" id="iosHint" hidden data-t="ios"></p>
</div></section>

<section class="band hidden" id="detail" style="padding-top:0"><div class="wrap det">
  <div class="panel"><h2 data-t="steps"></h2><ol class="route" id="route"></ol><p class="note" data-t="tzNote"></p></div>
  <div style="display:grid;gap:18px">
    <div class="cd" id="cd"></div>
    <div class="panel"><div class="fig"><svg id="map"></svg></div><div class="legend" id="legend"></div>
      <div class="acts" id="dacts"></div></div>
    <div class="panel"><h2 data-t="visa"></h2><ul class="vz" id="visa"></ul><div class="acts" id="vlinks"></div></div>
    <div class="panel"><h2 data-t="docs"></h2><p style="margin:0" data-t="docsText"></p></div>
  </div>
</div></section>

<section class="band" id="saved" style="padding-top:0"><div class="wrap">
  <h2 data-t="myTrips"></h2><div class="trips" id="trips"></div>
</div></section>
</main>

  case'UA':if(E)return['ok','uaFree'];if(cc==='GB'||cc==='US')return['need','visa'];if(cc==='BY'||cc==='RU')return['need','restr'];return['warn','check'];
  case'RU':if(cc==='BY')return['ok','free'];if(S)return['need','sv'];if(E||cc==='GB'||cc==='US')return['need','visa'];if(cc==='UA')return['need','restr'];return['warn','check'];

  ${buyable&&boughtSet?`<button class="btn ${b?'ok':''}" data-b="${i}">${esc(b?tr('bought'):tr('mark'))}</button>`:''}</div></li>`}
let tick=null,curTrip=null;
function renderDetail(it,pass,trip){curTrip=trip;const bs=trip?new Set(trip.bought||[]):new Set();
  $('#route').innerHTML=it.legs.map((l,i)=>legHTML(l,i,trip?bs:bs)).join('');
  $('#route').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const i=+b.dataset.b;bs.has(i)?bs.delete(i):bs.add(i);if(trip){trip.bought=[...bs];const all=getTrips().map(x=>x.id===trip.id?trip:x);setTrips(all);renderTrips()}else{st.bought=bs}renderDetail(it,pass,trip||null);if(!trip){}});
  const first=it.legs.find(l=>['air','train','bus','car'].includes(l.mode))||it.legs[0];const leave=it.legs[0].dep;
  clearInterval(tick);const upd=()=>{const ms=first.dep-Date.now();$('#cd').innerHTML=ms>0?`<span>${esc(tr('countdown'))} ${ICON[first.mode]}</span><b>${fDur(ms)}</b><span>${esc(tr('leave'))}: ${fD(leave,it.legs[0].a.tz)} ${fT(leave,it.legs[0].a.tz)}</span>`:`<b>${esc(tr('started'))}</b>`};upd();tick=setInterval(upd,3e4);
  const V=visas(it,pass);$('#visa').innerHTML=V.out.map(v=>`<li class="${v.l}">${esc(v.t)}</li>`).join('');
  const vl=[[tr('official')+' · IATA Travel Centre','https://www.iatatravelcentre.com/']];if(V.ccs.some(c=>SCH.has(c)))vl.push(['ETIAS','https://travel-europe.europa.eu/etias_en']);if(V.ccs.includes('GB'))vl.push(['UK ETA','https://www.gov.uk/guidance/apply-for-an-electronic-travel-authorisation-eta']);if(V.ccs.includes('US'))vl.push(['ESTA','https://esta.cbp.dhs.gov/']);
  $('#vlinks').innerHTML=vl.map(k=>`<a class="btn" href="${k[1]}" target="_blank" rel="noopener">${esc(k[0])}</a>`).join('');
  drawMap(it);const A=it.legs[0].a,Z=it.legs.at(-1).b;
  $('#dacts').innerHTML=`<button class="btn p" id="sv">${esc(trip?tr('saved'):tr('save'))}</button><button class="btn" id="ics">${esc(tr('ics'))}</button><button class="btn" id="cp">${esc(tr('copy'))}</button><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${A.lat},${A.lon}&destination=${Z.lat},${Z.lon}">${esc(tr('maps'))}</a>`;
  $('#sv').onclick=()=>{if(trip)return;const t={id:Date.now(),it:ser(it),pass,bought:[...(st.bought||[])]};setTrips([t,...getTrips()]);$('#sv').textContent=tr('saved');renderTrips()};
  $('#ics').onclick=()=>icsSave(it);$('#cp').onclick=async()=>{const tx=text(it);try{if(navigator.share){await navigator.share({title:'Waylo',text:tx});return}}catch(e){if(e&&e.name==='AbortError')return}try{await navigator.clipboard.writeText(tx);$('#cp').textContent=tr('copied')}catch(e){}};
  $('#legend').innerHTML=[...new Set(it.legs.map(l=>l.mode))].map(m=>`<span><i class="dot" style="background:${COL(m)}"></i>${esc(m==='local'?tr('local'):m==='stay'?tr('stay'):tr(m))}</span>`).join('')}
function drawMap(it){const s=$('#map');const pts=[];it.legs.forEach(l=>{pts.push(l.a);pts.push(l.b)});
  const draw=()=>{const W=s.clientWidth||400,H=s.clientHeight||260,p=34;const la=pts.map(c=>c.lat),lo=pts.map(c=>c.lon);const k=Math.cos((Math.max(...la)+Math.min(...la))/2*R);
    let x0=Math.min(...lo)*k,x1=Math.max(...lo)*k,y0=Math.min(...la),y1=Math.max(...la);const sp=Math.max(x1-x0,y1-y0,.5);const sc=Math.min((W-2*p)/Math.max(x1-x0,sp*.3),(H-2*p)/Math.max(y1-y0,sp*.3));
    const cx=(x0+x1)/2,cy=(y0+y1)/2;const P=c=>[W/2+(c.lon*k-cx)*sc,H/2-(c.lat-cy)*sc];let g='';
    it.legs.forEach(l=>{if(l.a===l.b)return;const[a,b]=[P(l.a),P(l.b)];if(l.mode==='air'){const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-Math.hypot(b[0]-a[0],b[1]-a[1])*.18;g+=`<path d="M${a} Q${mx},${my} ${b}" fill="none" stroke="${COL('air')}" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>`}else g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${COL(l.mode)}" stroke-width="5" stroke-linecap="round"/>`});
    const uniq=[...new Set(pts)];uniq.forEach((c,i)=>{const[x,y]=P(c);const end=c===pts[0]||c===pts.at(-1);g+=`<circle cx="${x}" cy="${y}" r="${end?8:6}" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>`;
      if(W>300||end)g+=`<text x="${x}" y="${y-13}" text-anchor="${x<60?'start':x>W-60?'end':'middle'}" font-size="13" font-weight="${end?800:600}" fill="var(--ink)" paint-order="stroke" stroke="var(--bg)" stroke-width="4">${esc(nm(c))}</text>`});s.innerHTML=g};
  draw();if(!s._ro){s._ro=new ResizeObserver(()=>s._draw&&s._draw());s._ro.observe(s)}s._draw=draw}
function text(it){return it.legs.map(l=>`${ICON[l.mode]} ${fD(l.dep,l.a.tz)} ${fT(l.dep,l.a.tz)} ${l.mode==='stay'?tr('stay')+' '+nm(l.a):l.fp+' ('+nm(l.a)+')'} → ${fT(l.arr,l.b.tz)} ${l.tp?l.tp+' ('+nm(l.b)+')':''}`).join('\n')+`\n≈ ${money(it.price)}`}
const ser=it=>({kind:it.kind,price:it.price,tr:it.tr,legs:it.legs.map(l=>({...l,a:l.a.id,b:l.b.id,dep:+l.dep,arr:+l.arr}))});
const des=o=>{const C=Object.fromEntries(CITIES.map(c=>[c.id,c]));const legs=o.legs.map(l=>({...l,a:C[l.a],b:C[l.b],dep:new Date(l.dep),arr:new Date(l.arr)}));return{...o,legs,dep:legs[0].dep,arr:legs.at(-1).arr}};
let DL=null;
async function icsSave(it){const f=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');const ev=it.legs.filter(l=>l.mode!=='local').map((l,i)=>`BEGIN:VEVENT\r\nUID:waylo-${+l.dep}-${i}\r\nDTSTAMP:${f(new Date())}\r\nDTSTART:${f(l.dep)}\r\nDTEND:${f(l.arr)}\r\nSUMMARY:${ICON[l.mode]} ${l.mode==='stay'?tr('stay')+' '+nm(l.a):nm(l.a)+' → '+nm(l.b)}\r\nLOCATION:${(l.fp||'').replace(/[,;]/g,' ')}\r\nBEGIN:VALARM\r\nTRIGGER:-PT3H\r\nACTION:DISPLAY\r\nDESCRIPTION:Waylo\r\nEND:VALARM\r\nEND:VEVENT`).join('\r\n');
  const data=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Waylo//EN\r\n${ev}\r\nEND:VCALENDAR\r\n`;
  try{if(!DL&&window.claude)DL=await window.claude.use('downloads');if(DL){await DL.save({filename:'waylo-trip.ics',data});return}}catch(e){}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/calendar'}));a.download='waylo-trip.ics';a.click()}catch(e){}}
function renderTrips(){const ts=getTrips();$('#trips').innerHTML=ts.length?ts.map(t=>{const it=des(t.it);const A=it.legs[0].a,Z=it.legs.at(-1).b;const n=it.legs.filter(l=>['air','train','bus','stay'].includes(l.mode)).length;
  return`<div class="trip"><div><b>${esc(nm(A))} → ${esc(nm(Z))}</b><div class="note">${esc(fD(it.dep,A.tz))} ${fT(it.dep,A.tz)} · ${esc(tr(it.kind))} · ${esc(tr('bought'))} ${(t.bought||[]).length}/${n} · ${it.dep>Date.now()?esc(tr('countdown'))+' '+fDur(it.dep-Date.now()):esc(tr('started'))}</div></div>
  <div class="acts" style="margin:0"><button class="btn p" data-o="${t.id}">${esc(tr('open'))}</button><button class="btn" data-d="${t.id}">${esc(tr('del'))}</button></div></div>`}).join(''):`<p class="note">${esc(tr('noTrips'))}</p>`;
  $('#trips').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const t=getTrips().find(x=>x.id==b.dataset.o);if(!t)return;$('#detail').classList.remove('hidden');renderDetail(des(t.it),t.pass,t);$('#detail').scrollIntoView({behavior:'smooth'})});
  $('#trips').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{setTrips(getTrips().filter(x=>x.id!=b.dataset.d));renderTrips()})}
/* voice input for destination */
(async()=>{try{if(!window.claude)return;const d=await window.claude.use('dictation');if(!d)return;const mic=$('#mic');mic.classList.remove('hidden');let on=false;
  d.onFinal(({text})=>{const w=text.toLowerCase();const c=CITIES.find(c=>[c.en,c.ru].some(x=>w.includes(x.toLowerCase().slice(0,Math.max(4,x.length-2)))));if(c){$('#to').value=nm(c)}else $('#to').value=text});
  d.onState(({state})=>{on=state==='listening';mic.textContent=on?'⏹':'🎤'});
  mic.onclick=()=>{if(on){d.stop().catch(()=>{});return}d.start().catch(()=>{})}}catch(e){}})();
/* PWA: offline + install */
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#inst').textContent=tr('install');$('#inst').classList.remove('hidden')});
$('#inst').onclick=async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;$('#inst').classList.add('hidden')};
try{const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone;$('#iosHint').hidden=!ios}catch(e){}
applyLang();
if(!$('#from').value){const c=byTz();if(c)$('#from').value=nm(c)}
$('#to').value=nm(CITIES.find(c=>c.id==='warsaw'));
}
</script>
</body>
